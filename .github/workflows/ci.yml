name: CI

# Runs on every push and every pull request targeting main, so problems
# surface before code merges rather than after.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    # Spins up a real Postgres for the whole job — same engine as
    # production, not a mock or SQLite stand-in. Credentials match what
    # tests/conftest.py already expects (postgres/postgres@localhost:5432),
    # so no test code needs to change to run here vs. locally.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: supplement_tracker_test
        ports:
          - 5432:5432
        # Waits for Postgres to actually be ready to accept connections
        # before the job proceeds — without this, the first steps that hit
        # the DB can fail with "connection refused" on a slow-starting
        # container.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run database migrations
        # Applies Alembic migrations against a fresh database, the same
        # way a real deploy would — this catches broken/out-of-order
        # migrations before they'd ever hit a real environment.
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/supplement_tracker_test
          SECRET_KEY: ci-test-secret-key-not-for-production
        run: alembic upgrade head

      - name: Run tests
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
        # DATABASE_URL isn't set here on purpose — conftest.py sets it
        # itself before any app module is imported, pointing at the same
        # service container via localhost.
        run: pytest -v

  frontend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
