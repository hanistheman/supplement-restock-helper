name: CI

# Runs on every push and every pull request targeting main, so problems
# surface before code merges rather than after.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    # Check Django migrations against PostgreSQL. The test suite itself
    # uses its isolated SQLite test settings, so it does not need this
    # service to run.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: supplement_tracker_test
        ports:
          - 5432:5432
        # Waits for Postgres to actually be ready to accept connections
        # before the job proceeds — without this, the first steps that hit
        # the DB can fail with "connection refused" on a slow-starting
        # container.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      SECRET_KEY: ci-test-secret-key-not-for-production

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run Django checks
        run: python manage.py check

      - name: Check migration state
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/supplement_tracker_test
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations to PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/supplement_tracker_test
        run: python manage.py migrate --noinput

      - name: Run tests
        run: pytest -q

  frontend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
